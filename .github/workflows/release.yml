name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attest and re-upload assets for
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create or update release
        run: |
          if gh release view "$TAG" --json tagName -q .tagName; then
            gh release upload "$TAG" main.js manifest.json --clobber
          else
            gh release create "$TAG" main.js manifest.json --title "$TAG" --generate-notes
          fi
